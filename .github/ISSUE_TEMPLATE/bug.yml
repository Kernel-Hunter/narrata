name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press play ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Web app
        - Browser extension
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 141 on Windows 11
    validations:
      required: true
  - type: input
    id: voice
    attributes:
      label: Voice and engine
      description: Shown in More, then About and storage (for example "Kokoro on the processor, 4 threads" or "Piper voice Kristin").
  - type: textarea
    id: file
    attributes:
      label: File or page
      description: If it happens with a particular PDF, EPUB or web page, a link or a short sample helps. Do not attach private documents.
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Errors from the browser's developer console, if any.
      render: text
